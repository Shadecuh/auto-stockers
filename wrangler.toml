name = "auto-stockers"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "auto-stockers-db"
database_id = "01acbe8f-d2a1-403b-abe8-84233517e54e"

[triggers]
crons = ["0 14 * * *"]

# --- Preview environment: a separate Worker + separate database ---
[env.preview]
name = "auto-stockers-preview"

[env.preview.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "auto-stockers-preview"
database_id = "8389a242-f24f-4194-abdc-7c45d237f69e"

# Secrets (set with `wrangler secret put <NAME>`, never in this file):
#   ADMIN_PASSWORD
#   GEMINI_API_KEY
